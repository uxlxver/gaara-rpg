<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15110f">
<title>Gaara RPG</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<header><div><b>GAARA RPG</b><small id="scene">Sem história aberta</small></div><button id="menuBtn">☰</button></header>
<main id="chat"></main>
<div id="typing" hidden>Gaara está respondendo…</div>
<section class="composer">
  <textarea id="input" rows="1" placeholder="Escreva como Saruto…"></textarea>
  <button id="send">➤</button>
</section>
<nav>
 <button data-tab="chat" class="active">Chat</button><button data-tab="memory">Memória</button>
 <button data-tab="world">Mundo</button><button data-tab="journal">Diário</button>
</nav>
</div>

<dialog id="panel"><div class="panelHead"><b id="panelTitle"></b><button id="closePanel">✕</button></div><div id="panelBody"></div></dialog>
<dialog id="menu"><div class="panelHead"><b>Gaara RPG</b><button id="closeMenu">✕</button></div><div class="menuGrid">
<button id="newSave">Nova história</button><button id="switchSave">Trocar história</button>
<button id="settings">Configurações</button><button id="searchBtn">Buscar</button>
<button id="exportBtn">Exportar save</button><label class="button">Importar save<input id="importFile" type="file" accept=".json" hidden></label>
<button id="clearBtn" class="danger">Apagar história</button>
</div></dialog>

<dialog id="setup"><div class="panelHead"><b>Configuração</b><button id="closeSetup">✕</button></div>
<div class="form">
<label>Groq API Key<input id="apiKey" type="password" placeholder="gsk_…"></label>
<p class="warning">A chave fica somente neste navegador. Em GitHub Pages ela necessariamente é usada pelo navegador; use uma chave exclusiva para este RPG e revogue-a se o aparelho for perdido.</p>
<label>Modelo<input id="model" value="openai/gpt-oss-120b"></label>
<label>Temperatura<input id="temperature" type="number" min="0" max="2" step=".1" value=".85"></label>
<label>Máx. tokens<input id="maxTokens" type="number" min="200" max="8000" value="1200"></label>
<label>Mensagens recentes<input id="contextCount" type="number" min="8" max="80" value="32"></label>
<button id="testGroq">Testar Groq</button><button id="saveSettings">Salvar</button><div id="testResult"></div>
</div></dialog>
<script src="./app.js?v=1"></script>
</body></html>
